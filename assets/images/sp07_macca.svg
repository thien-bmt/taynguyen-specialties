<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMacca" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3e2723"/>
      <stop offset="100%" stop-color="#1b0000"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgMacca)"/>
  
  <circle cx="200" cy="140" r="90" fill="#5d4037" opacity="0.4"/>
  
  <!-- Macadamia Shells & Kernels -->
  <!-- Shell 1 cracked open -->
  <circle cx="160" cy="150" r="35" fill="#4e342e" stroke="#21120e" stroke-width="4"/>
  <!-- Shell crack slit -->
  <path d="M 130 150 Q 160 145 190 150" fill="none" stroke="#d7ccc8" stroke-width="4"/>
  <!-- Kernel inside -->
  <circle cx="160" cy="150" r="22" fill="#fff8e1" stroke="#ffe082" stroke-width="2"/>

  <!-- Shell 2 (Whole) -->
  <circle cx="240" cy="140" r="38" fill="#3e2723" stroke="#1b0000" stroke-width="4"/>
  <path d="M 210 135 C 230 120 260 120 270 145" fill="none" stroke="#5d4037" stroke-width="3"/>

  <!-- Shell 3 (Half with nut) -->
  <circle cx="200" cy="200" r="32" fill="#4e342e" stroke="#21120e" stroke-width="4"/>
  <circle cx="200" cy="200" r="20" fill="#ffecb3" stroke="#ffe082" stroke-width="2"/>

  <!-- Tag -->
  <rect x="20" y="20" width="110" height="30" rx="15" fill="#6d4c41"/>
  <text x="75" y="40" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="13" text-anchor="middle">LÂM ĐỒNG</text>
</svg>
