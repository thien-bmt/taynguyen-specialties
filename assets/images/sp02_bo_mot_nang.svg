<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5c1d1d"/>
      <stop offset="100%" stop-color="#2a0808"/>
    </linearGradient>
    <linearGradient id="beefGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b71c1c"/>
      <stop offset="50%" stop-color="#880e4f"/>
      <stop offset="100%" stop-color="#4a0007"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgGrad2)"/>
  <circle cx="200" cy="140" r="90" fill="#792222" opacity="0.5"/>
  
  <!-- Wooden Board -->
  <ellipse cx="200" cy="200" rx="150" ry="40" fill="#5d4037" stroke="#3e2723" stroke-width="4"/>
  <ellipse cx="200" cy="195" rx="140" ry="34" fill="#8d6e63"/>
  
  <!-- Dried Beef Slices -->
  <path d="M 120 150 Q 180 130 250 150 Q 270 175 220 190 Q 150 195 110 175 Z" fill="url(#beefGrad)" stroke="#ff8a80" stroke-width="2"/>
  <path d="M 160 120 Q 220 100 280 125 Q 300 150 250 165 Q 180 170 140 145 Z" fill="url(#beefGrad)" stroke="#ff8a80" stroke-width="2"/>
  
  <!-- Grill marks & herbs -->
  <line x1="150" y1="135" x2="230" y2="155" stroke="#3e2723" stroke-width="3" opacity="0.6"/>
  <line x1="170" y1="125" x2="250" y2="145" stroke="#3e2723" stroke-width="3" opacity="0.6"/>
  <circle cx="190" cy="145" r="3" fill="#ffeb3b"/>
  <circle cx="210" cy="150" r="4" fill="#ff3d00"/>
  <circle cx="230" cy="140" r="3" fill="#4caf50"/>

  <!-- Salt dip bowl -->
  <circle cx="110" cy="200" r="22" fill="#d7ccc8" stroke="#5d4037" stroke-width="3"/>
  <circle cx="110" cy="200" r="16" fill="#f57f17"/>
  <circle cx="106" cy="196" r="3" fill="#ffffff"/>
  <circle cx="114" cy="202" r="2" fill="#33691e"/>

  <!-- Tag -->
  <rect x="20" y="20" width="100" height="30" rx="15" fill="#e67e22"/>
  <text x="70" y="40" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="13" text-anchor="middle">GIA LAI</text>
</svg>
