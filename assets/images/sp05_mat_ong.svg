<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="honeyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb300"/>
      <stop offset="50%" stop-color="#ff8f00"/>
      <stop offset="100%" stop-color="#ff6f00"/>
    </linearGradient>
    <linearGradient id="bgHoney" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="100%" stop-color="#ffecb3"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgHoney)"/>
  
  <!-- Honeycomb Pattern Background -->
  <polygon points="100,50 120,40 140,50 140,70 120,80 100,70" fill="#ffe082" stroke="#ffb300" stroke-width="2" opacity="0.4"/>
  <polygon points="140,50 160,40 180,50 180,70 160,80 140,70" fill="#ffe082" stroke="#ffb300" stroke-width="2" opacity="0.4"/>
  <polygon points="120,80 140,70 160,80 160,100 140,110 120,100" fill="#ffe082" stroke="#ffb300" stroke-width="2" opacity="0.4"/>

  <!-- Honey Jar -->
  <rect x="150" y="90" width="100" height="150" rx="20" fill="url(#honeyGrad)" stroke="#ff6f00" stroke-width="4"/>
  <ellipse cx="200" cy="90" rx="45" ry="12" fill="#ffe082"/>
  
  <!-- Jar Lid -->
  <rect x="145" y="70" width="110" height="20" rx="5" fill="#8d6e63" stroke="#4e342e" stroke-width="3"/>
  <path d="M 145 80 L 140 100 Q 150 105 160 98 Q 170 105 180 98 Q 190 105 200 98 Q 210 105 220 98 Q 230 105 240 98 L 255 80 Z" fill="#a1887f"/>
  
  <!-- Label on Jar -->
  <rect x="160" y="125" width="80" height="70" rx="8" fill="#ffffff" stroke="#ffb300" stroke-width="2"/>
  <circle cx="200" cy="155" r="18" fill="#fff8e1"/>
  <!-- Bee icon inside label -->
  <ellipse cx="200" cy="155" rx="10" ry="7" fill="#ffb300"/>
  <line x1="196" y1="150" x2="196" y2="160" stroke="#000000" stroke-width="2"/>
  <line x1="202" y1="150" x2="202" y2="160" stroke="#000000" stroke-width="2"/>

  <!-- Honey Dipper -->
  <path d="M 280 100 Q 230 140 215 170" fill="none" stroke="#8d6e63" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="280" cy="100" rx="14" ry="20" fill="#d7ccc8" transform="rotate(-35, 280, 100)"/>

  <!-- Tag -->
  <rect x="20" y="20" width="100" height="30" rx="15" fill="#ffa000"/>
  <text x="70" y="40" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="13" text-anchor="middle">GIA LAI</text>
</svg>
