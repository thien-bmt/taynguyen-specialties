<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a2c11"/>
      <stop offset="100%" stop-color="#1f0e04"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#d35400"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  <!-- Decorative circle -->
  <circle cx="200" cy="130" r="85" fill="#5c3818" opacity="0.6"/>
  
  <!-- Coffee Cup -->
  <path d="M 130 110 L 270 110 L 255 200 C 255 215 240 225 200 225 C 160 225 145 215 145 200 Z" fill="#d7ccc8" stroke="#8d6e63" stroke-width="4"/>
  <!-- Coffee liquid -->
  <ellipse cx="200" cy="115" rx="65" ry="12" fill="#3e2723"/>
  <ellipse cx="200" cy="115" rx="50" ry="8" fill="#5d4037"/>
  
  <!-- Cup Handle -->
  <path d="M 265 125 C 295 125 295 175 258 185" fill="none" stroke="#d7ccc8" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Steam -->
  <path d="M 170 95 Q 160 75 175 55 T 165 35" fill="none" stroke="#ffe0b2" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  <path d="M 200 90 Q 210 70 195 50 T 205 30" fill="none" stroke="#ffe0b2" stroke-width="4" opacity="0.8" stroke-linecap="round"/>
  <path d="M 230 95 Q 220 75 235 55 T 225 35" fill="none" stroke="#ffe0b2" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  
  <!-- Coffee Beans -->
  <g transform="translate(110, 210) rotate(-20) scale(0.8)">
    <ellipse cx="20" cy="20" rx="18" ry="12" fill="#3e2723" stroke="#e0a96d" stroke-width="2"/>
    <path d="M 10 20 Q 20 25 30 20" fill="none" stroke="#1b0000" stroke-width="3"/>
  </g>
  <g transform="translate(260, 215) rotate(25) scale(0.9)">
    <ellipse cx="20" cy="20" rx="18" ry="12" fill="#4e342e" stroke="#e0a96d" stroke-width="2"/>
    <path d="M 10 20 Q 20 25 30 20" fill="none" stroke="#1b0000" stroke-width="3"/>
  </g>

  <!-- Tag -->
  <rect x="20" y="20" width="110" height="30" rx="15" fill="url(#goldGrad)"/>
  <text x="75" y="40" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="13" text-anchor="middle">ĐẮK LẮK</text>
</svg>
