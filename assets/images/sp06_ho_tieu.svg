<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPepper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#37474f"/>
      <stop offset="100%" stop-color="#263238"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgPepper)"/>
  
  <circle cx="200" cy="150" r="90" fill="#455a64" opacity="0.5"/>
  
  <!-- Wooden Pepper Bowl -->
  <ellipse cx="200" cy="180" rx="110" ry="45" fill="#5d4037" stroke="#3e2723" stroke-width="4"/>
  <ellipse cx="200" cy="170" rx="100" ry="38" fill="#8d6e63"/>
  
  <!-- Pepper Corns inside Bowl -->
  <ellipse cx="200" cy="170" rx="90" ry="30" fill="#212121"/>
  
  <!-- Individual Pepper corns details -->
  <circle cx="160" cy="165" r="7" fill="#424242"/>
  <circle cx="175" cy="175" r="8" fill="#212121"/>
  <circle cx="190" cy="160" r="7" fill="#616161"/>
  <circle cx="210" cy="170" r="8" fill="#212121"/>
  <circle cx="230" cy="165" r="7" fill="#424242"/>
  <circle cx="240" cy="178" r="6" fill="#212121"/>

  <!-- Green Pepper Vine Branch -->
  <path d="M 120 100 Q 170 80 230 110" fill="none" stroke="#2e7d32" stroke-width="5" stroke-linecap="round"/>
  <circle cx="130" cy="98" r="5" fill="#4caf50"/>
  <circle cx="140" cy="94" r="6" fill="#388e3c"/>
  <circle cx="152" cy="90" r="5" fill="#4caf50"/>
  <circle cx="165" cy="88" r="6" fill="#2e7d32"/>
  <circle cx="178" cy="90" r="5" fill="#4caf50"/>

  <!-- Tag -->
  <rect x="20" y="20" width="100" height="30" rx="15" fill="#455a64"/>
  <text x="70" y="40" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="13" text-anchor="middle">GIA LAI</text>
</svg>
